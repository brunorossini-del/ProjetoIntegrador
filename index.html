<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!--faz a página usar a largura real da tela do
    dispositivo e define o zoom inicial como 100%.-->
    <title>Me Gusta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Geostar+Fill&family=Oswald:wght@200..700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS:wght@100..400&family=Playwrite+NZ+Guides&family=Poller+One&family=Supermercado+One&display=swap');

        /*importamos a fonte do Google*/
        body {
            background-repeat: no-repeat;
            /* Impede a repetição */
            background-size: cover;
            /* Ajusta a imagem de fundo ao tamanho da tela */
            opacity: 0, 5;
            /*opacidade da imagem de fundo*/
            background-color: gray;
        }

        /* Menu responsivo: o tamanho da fonte se adapta entre 11px e 15px conforme a largura da tela. */
        .cabe .navbar-nav .nav-link {
            color: rgba(224, 224, 216);
            font-size: clamp(11px, 1.1vw, 15px);
            white-space: nowrap;
            padding-left: 0.6rem;
            padding-right: 0.6rem;
        }

        .cabe .nav-link:hover,
        .cabe .nav-link.active {
            color: #abacb1;
        }

        .cabe .navbar-toggler {
            border-color: rgba(224, 224, 216, 0.6);
        }

        .slogan {
            /*fonte usada no slogan*/
            font-family: "Poller One", sans-serif;
            color: rgba(224, 224, 216);
            /*cor da fonte do slogan*/
        }

        /* O clamp() faz o tamanho do slogan se adaptar ao tamanho da tela, entre 22px e 40px. */
        .slogan p {
            font-size: clamp(22px, 4vw, 40px);
            margin-bottom: 0;
        }

        /* A imagem ocupa 100% da largura e mantém a proporção 16:9 em diferentes telas. */
        .carousel-item img {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <header class="cabe"> <!--div para o cabeçalho-->

        <!-- O navbar-expand-lg faz o menu ficar recolhido em telas pequenas e expandido em telas grandes. -->
        <nav class="navbar navbar-expand-lg"> <!--Em tela pequena o menu recolhe e em tela grande o menu expande.-->

            <!-- flex-wrap permite quebra de linha em telas menores; flex-lg-nowrap impede a quebra em telas grandes. -->
            <div class="container-fluid flex-wrap flex-lg-nowrap py-2">

                <a class="navbar-brand py-0" href="index.html">
                    <img src="img/LogoMeGusta.png" alt="Logo Me Gusta" class="img-fluid" style="max-width: 200px;">
                </a>

                <!-- O botão aparece para abrir o menu quando a tela é pequena. -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button><!--Botão quando o menu está recolhido-->

                <!-- "collapse" permite esconder/mostrar o menu no celular. -->
                <div class="collapse navbar-collapse" style="margin-top: -40px; " id="menuPrincipal">

                    <!--
                        text-center centraliza o menu em telas pequenas.
                        text-lg-start alinha à esquerda em telas grandes.
                        ms-lg-4, mt-lg-0 e flex-lg-nowrap são aplicados a partir do tamanho "lg".
                    -->
                    <ul class="navbar-nav ms-lg-4 text-center text-lg-start mt-3 mt-lg-0 flex-lg-nowrap">
                        <br>
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="SobreNós.html">SOBRE NÓS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Produtos.html">PRODUTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Eventos.html">EVENTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Localização.html">LOCALIZAÇÃO</a></li>
                        <li class="nav-item"><a class="nav-link" href="PainelSatisfação.html">PAINEL SATISFAÇÃO</a></li>
                        <li class="nav-item"><a class="nav-link" href="Sig a gente.html">SIGA A GENTE</a></li>

                    </ul>
                </div>
            </div>
        </nav>

        <!-- ps-3 usa um espaçamento menor em telas pequenas e ps-lg-5 aumenta o espaçamento em telas grandes. -->
        <div class="slogan text-start container-fluid ps-3 ps-lg-5 py-3" style="position: relative; top: px;">

            <!--div para o slogan-->
            <p>Exclusividade<br>e verdadeiro<br>sabor, Isso é<br>Me Gusta!</p>
            <!--slogan-->

        </div>
    </header>

    <!-- O carrossel do Bootstrap se adapta à largura disponível da tela. -->
    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">

                <!-- w-100 faz a imagem ocupar 100% da largura disponível. -->
                <img src="img/img_carrossel1.png" class="d-block w-100" alt="Carrossel Me Gusta imagem 1">

            </div>

            <div class="carousel-item">
                <img src="img/img_carrossel.png" class="d-block w-100" alt="Carrossel Me Gusta imagem 2">
            </div>

            <div class="carousel-item">
                <img src="img/img_carrossel2.png" class="d-block w-100" alt="Carrossel Me Gusta imagem 3">
            </div>

        </div>
    </div>


    <!-- O JavaScript do Bootstrap permite o funcionamento do menu responsivo e do carrossel. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
