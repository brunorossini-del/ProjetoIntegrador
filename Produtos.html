<head>

    <link rel="stylesheet" href="estilos/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Geostar+Fill&family=Oswald:wght@200..700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS:wght@100..400&family=Playwrite+NZ+Guides&family=Poller+One&family=Supermercado+One&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        body {
            /* fundo da página */
            background-color: rgb(222, 222, 222);
        }

        .menu {
            /* menu principal */
            background-image: url(img/Banner\ MENU.png);
            width: 100%;
            height: 200px;
        }

        .titulo {
            /* titulo principal */
            text-align: center;
            font-family: "Poller One", sans-serif;
            font-size: 30px;
            padding: 15px;
            color: rgb(110, 52, 1);
        }

        .clear {
            clear: both;
        }


        .fundo {
            /* fundo do menu de sorvetes*/
            background-image: url("img/banner\ de\ produtos\ \(PRODUTOS\).png");
            width: 100%;
            height: 300px;
            /* Ajustado para bater com a altura da imagem interna */
            background-position: right;
            background-size: 75% 100%;
            /* Ocupa 50% da largura e 100% da altura */
            background-repeat: no-repeat;

        }

        .meio {
            width: 25%;
            height: 300px;
            overflow: hidden;

        }

        .meio img {
            /* imagem principal do menu de sorvetes*/
            width: 100vw;
            height: 300px;
        }

        .meio:hover {
            /*informações que muda o tamanho da imagem*/
            width: 100%;
            transition: width 3s;
        }

        .conteiner_img {
            width: 80%;
            margin: auto;
            background-color: rgb(110, 52, 1);
            padding: 15px;
            border-radius: 20px;

        }

        /*----------------------------------------------------------------------------------------------------------*/

        .rodapé {
            /* rodapé informações */
            width: 20%;
            height: 600px;
            background-size: 100%;
            background-repeat: no-repeat;
            box-sizing: border-box;
        }

        .rodapéA {
            background-image: url(img/Facebook.png);
        }

        .rodapéB {
            background-image: url(img/15.jpg);
        }

        .br {
            background-color: rgb(222, 222, 222);
        }

        .slogan_roda {
            margin-right: 50px;
            width: 200px;
            font-family: "Poller One", sans-serif;
            text-align: center;
            font-size: 22px;
            color: rgba(224, 224, 216);
            line-height: 40px;
            padding-top: 20px;


        }
        .linha {
      width: 70%;
      height: 5px;
      background-color: rgb(110, 52, 1);
      margin: 20px auto;
      border-radius: 10px;
    }

        /* ==============================================================
           AJUSTES DE RESPONSIVIDADE
           O layout de desktop continua 100% controlado pelo seu arquivo
           estilos/style.css (.logo, .cabe, .cabe ul, .cabe ul li,
           .fundo_rodapé, .roda .down_down...). Aqui só entram regras
           NOVAS (botão hambúrguer) e ajustes que só valem no mobile.
           ============================================================== */

        /* Evita que a imagem 100vw do .meio cause rolagem horizontal */
        .meio img {
            max-width: 100%;
        }

        /* Botão hambúrguer (estilo da imagem 1) — classe nova, não existe
           conflito com o CSS externo */
        .navbar-toggler {
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 10px 16px;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            background-image: none;
            width: 24px;
            height: 2px;
            background-color: #fff;
            display: block;
            position: relative;
        }

        .navbar-toggler-icon::before,
        .navbar-toggler-icon::after {
            content: "";
            position: absolute;
            left: 0;
            width: 24px;
            height: 2px;
            background-color: #fff;
        }

        .navbar-toggler-icon::before {
            top: -7px;
        }

        .navbar-toggler-icon::after {
            top: 7px;
        }

        /* Painel do menu (#menuMobile) some por padrão no mobile;
           acima de 768px ele é forçado a aparecer, pois quem manda no
           layout de desktop é o .cabe ul do CSS externo */
        @media (min-width: 768px) {
            .menu-links.collapse {
                display: block !important;
            }
        }

        @media (max-width: 767.98px) {
            .menu {
                height: auto;
                min-height: 120px;
                padding-bottom: 10px;
                position: relative;
                background-size: cover;
                background-position: center;
            }

            .navbar-toggler {
                display: block;
                position: absolute;
                top: 18px;
                right: 20px;
                z-index: 1100;
            }

            /* Sobrescreve, só no mobile, o float/left fixo do CSS externo,
               que deixava a logo grande "vazando" para fora do cabeçalho */
            .logo {
                position: static;
                float: none;
                left: 0;
                margin: 0;
                padding: 0;
                display: block;
            }

            .logo img {
                width: 130px !important;
                height: auto !important;
                margin: 0;
                padding: 0;
            }

            /* Sobrescreve, só no mobile, o posicionamento em float/coluna
               fixa que o CSS externo usa para telas grandes */
            .menu-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: rgba(120, 120, 120, 0.95);
                z-index: 1000;
            }

            .menu-links ul {
                float: none;
                width: 100%;
                margin: 0;
                top: 0;
                text-align: center;
                padding: 20px 0;
            }

            .menu-links ul li {
                display: block;
                padding: 14px 0;
            }

            .menu-links ul li a {
                color: #fff;
                font-size: 16px;
                letter-spacing: 1px;
            }

            .fundo {
                height: 220px;
                background-size: contain;
                background-position: center;
            }

            .meio {
                width: 100%;
                height: auto;
            }

            .meio img {
                width: 100%;
                height: auto;
            }

            .carousel-item img {
                height: 260px !important;
                object-fit: cover;
            }

            .fundo_rodapé {
                height: auto;
                min-height: 200px;
                text-align: center;
                padding: 20px 0;
                align-items: center;
            }

            .fundo_rodapé > img {
                width: 100px;
                height: 100px;
            }

            .slogan_roda {
                margin: 0 auto;
                padding-top: 10px;
            }

            .down_down {
                display: flex;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
