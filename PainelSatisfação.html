<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Satisfação</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <link rel="stylesheet" href="estilos/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Geostar+Fill&family=Oswald:wght@200..700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS:wght@100..400&family=Playwrite+NZ+Guides&family=Poller+One&family=Supermercado+One&display=swap');


        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(222, 222, 222);
        }


        /* =========================
           MENU / CABEÇALHO
        ========================= */

        .menu {
            background-image: url(img/Banner\ MENU.png);
            width: 100%;
            height: 200px;
            background-size: cover;
        }

        .cabe {
            position: relative;
            width: 100%;
        }

        .logo {
            position: relative;
        }

        .logo img {
            display: block;
        }

        .clear {
            clear: both;
        }


        /* =========================
           BOTÃO 
        ========================= */

        .cabe .navbar-toggler {
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 10px 16px;
            margin: 0;
            position: absolute;
            cursor: pointer;
        }

        .cabe .navbar-toggler:focus {
            box-shadow: none;
            outline: none;
        }


   

        .navbar-toggler-icon {
            background-image: none !important;
            width: 24px;
            height: 2px;
            background-color: #fff;
            display: block;
            position: relative;
        }

        .navbar-toggler-icon::before,
        .navbar-toggler-icon::after {
            content: "";
            position: absolute;
            left: 0;
            width: 24px;
            height: 2px;
            background-color: #fff;
        }

        .navbar-toggler-icon::before {
            top: -7px;
        }

        .navbar-toggler-icon::after {
            top: 7px;
        }


        /* =========================
           MENU DE LINKS
        ========================= */

        .menu-links {
            position: relative;
        }

        .menu-links ul {
            margin: 0;
            padding: 0;
        }

        .menu-links ul li {
            list-style: none;
        }

        .menu-links ul li a {
            text-decoration: none;
        }


        /* =========================
           TÍTULO
        ========================= */

        .titulo {
            text-align: center;
            font-family: "Playfair Display", serif;
            font-size: 50px;
            padding: 15px;
            color: rgb(110, 52, 1);
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 900px;
            margin: 60px auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 23px;
            font-family: "Oswald", sans-serif;
        }


        /* =========================
           NOTAS
        ========================= */

        .rating {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .rating input {
            display: none;
        }

        .rating label {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
            transition: 0.5s;
        }

        .rating input:checked+label {
            background: #6b3e26;
            color: #fff;
        }

        .rating label:hover {
            background: #cca68a;
        }


        /* =========================
           TEXTAREA
        ========================= */

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            border: 2px solid #ccc;
            padding: 15px;
            resize: none;
            margin-bottom: 20px;
            font-family: "Oswald", sans-serif;
        }


        /* =========================
           BOTÃO ENVIAR
        ========================= */

        button:not(.navbar-toggler) {
            background: #6b3e26;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:not(.navbar-toggler):hover {
            background: #8a5335;
        }


        /* =========================
           RODAPÉ
        ========================= */

        .rodapé {
            width: 20%;
            height: 600px;
            background-size: 100%;
            background-repeat: no-repeat;
            box-sizing: border-box;
        }

        .rodapéA {
            background-image: url(img/logo\ 5.png);
        }

        .rodapéB {
            background-image: url(img/15.jpg);
        }

        .br {
            background-color: white;
        }

        .slogan_roda {
            margin-right: 50px;
            width: 200px;
            font-family: "Poller One", sans-serif;
            text-align: center;
            font-size: 22px;
            color: rgba(224, 224, 216);
            line-height: 40px;
            padding-top: 20px;
        }

        .auxiliar {
            position: relative;
            top: 200px;
        }

        .meio img {
            max-width: 100%;
        }


        /* =========================
           TELAS GRANDES
        ========================= */

        @media (min-width: 768px) {
            .menu-links.collapse {
                display: block !important;
            }

            .menu-links {
                position: absolute;

                left: 260px;
                top: 49px;

                margin: 0;
                padding: 0;

                width: auto;
                max-width: calc(100% - 310px);
            }

            .menu-links ul {
                display: flex;

                flex-direction: row;
                flex-wrap: nowrap;

                align-items: center;

                margin: 0;
                padding: 0;

                width: 100%;
                max-width: 100%;

                white-space: nowrap;

                justify-content: space-between;
            }

            .menu-links ul li {
                list-style: none;
                display: block;

                /*
                 * Evita que as margens dos links
                 * façam o menu ultrapassar a tela.
                 */
                margin-right: 0;

                flex-shrink: 1;
            }

            .menu-links ul li:last-child {
                margin-right: 0;
            }

            .menu-links ul li a {
                text-decoration: none;
                white-space: nowrap;
            }
        }


        /* =========================
           TELAS PEQUENAS
        ========================= */

        @media (max-width: 767.98px) {

            /* Cabeçalho */

            .menu {
                height: auto;
                min-height: 120px;
                padding-bottom: 10px;
                position: relative;
                background-size: cover;
                background-position: center;
            }

            .cabe .navbar-toggler {
                display: block !important;
                position: absolute;
                top: 18px;
                right: 20px;
                z-index: 1100;
            }


            /* =========================
               LOGO MOBILE
            ========================= */

            .logo {
                position: static;
                float: none;
                left: 0;
                margin: 0;
                padding: 0;
                display: block;
            }

            .logo img {
                width: 130px !important;
                height: auto !important;
                margin: 0;
                padding: 0;
            }


            /* =========================
               BOTÃO
            ========================= */

            .cabe .navbar-toggler {
                display: block !important;

                position: absolute;
                top: 18px;
                right: 20px;

                width: auto;
                height: auto;

                z-index: 1100;
            }


            /* =========================
               MENU MOBILE
            ========================= */

            .menu-links {
                position: absolute;

                top: 100%;
                left: 0;

                width: 100%;

                background-color: rgba(120, 120, 120, 0.95);

                z-index: 1000;

                padding: 0;
               
            }

            .menu-links ul {
                float: none;
                width: 100%;

                margin: 0;
                padding: 20px 0;

                text-align: center;

                display: block;
            }

            .menu-links ul li {
                display: block;
                width: 100%;
                padding: 14px 0;
            }

            .menu-links ul li a {
                color: #fff;
                font-size: 16px;
                letter-spacing: 1px;
                text-decoration: none;
            }

            .menu-links ul li a:hover {
                color: #e0e0d8;
            }


            /* =========================
               CONTEÚDO MOBILE
            ========================= */

            .container {
                width: calc(100% - 30px);
                margin: 30px auto;
                padding: 25px 20px;
            }

            .titulo {
                font-size: 35px;
                padding: 10px;
            }

            .subtitle {
                font-size: 20px;
            }

            .rating {
                gap: 10px;
            }

            .rating label {
                width: 38px;
                height: 38px;
            }

            textarea {
                height: 120px;
            }


            /* =========================
               OUTROS ELEMENTOS MOBILE
            ========================= */

            .fundo {
                height: 220px;
                background-size: contain;
                background-position: center;
            }

            .meio {
                width: 100%;
                height: auto;
            }

            .meio img {
                width: 100%;
                height: auto;
            }

            .carousel-item img {
                height: 260px !important;
                object-fit: cover;
            }


            /* =========================
               RODAPÉ MOBILE
            ========================= */

            .fundo_rodapé {
                height: auto;
                min-height: 200px;
                text-align: center;
                padding: 20px 0;
                align-items: center;
            }

            .fundo_rodapé>img {
                width: 100px;
                height: 100px;
            }

            .slogan_roda {
                margin: 0 auto;
                padding-top: 10px;
            }

            .down_down {
                display: flex;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;
            }

        }
    </style>
</head>


<body>


    <!-- =========================
       MENU PRINCIPAL
    ========================= -->

    <div class="menu">

        <div class="cabe">

            <!-- LOGO -->

            <div class="logo">

                <img src="img/LogoMeGusta.png" width="180px" class="img-fluid" alt="Logo Me Gusta">

            </div>


          

            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuMobile" aria-controls="menuMobile" aria-expanded="false" aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- LINKS DO MENU -->

            <div class="collapse menu-links" id="menuMobile">

                <ul>

                    <li>
                        <a href="index.html">HOME</a>
                    </li>

                    <li>
                        <a href="SobreNós.html">SOBRE NÓS</a>
                    </li>

                    <li>
                        <a href="Produtos.html">PRODUTOS</a>
                    </li>

                    <li>
                        <a href="Eventos.html">EVENTOS</a>
                    </li>

                    <li>
                        <a href="Localização.html">LOCALIZAÇÃO</a>
                    </li>

                    <li>
                        <a href="PainelSatisfação.html">PAINEL SATISFAÇÃO</a>
                    </li>

                    <li>
                        <a href="Sig a gente.html">SIGA A GENTE</a>
                    </li>

                </ul>

            </div>

        </div>

        <div class="clear"></div>

        <br>

    </div>


    <!-- =========================
       PAINEL DE SATISFAÇÃO
    ========================= -->

    <div class="container">

        <h1 class="titulo">
            Painel de Satisfação
        </h1>

        <p class="subtitle">
            Como foi sua experiência?
        </p>


        <!-- NOTAS -->

        <div class="rating">

            <input type="radio" id="n0" name="nota">
            <label for="n0">0</label>

            <input type="radio" id="n1" name="nota">
            <label for="n1">1</label>

            <input type="radio" id="n2" name="nota">
            <label for="n2">2</label>

            <input type="radio" id="n3" name="nota">
            <label for="n3">3</label>

            <input type="radio" id="n4" name="nota">
            <label for="n4">4</label>

            <input type="radio" id="n5" name="nota">
            <label for="n5">5</label>

            <input type="radio" id="n6" name="nota">
            <label for="n6">6</label>

            <input type="radio" id="n7" name="nota">
            <label for="n7">7</label>

            <input type="radio" id="n8" name="nota">
            <label for="n8">8</label>

            <input type="radio" id="n9" name="nota">
            <label for="n9">9</label>

            <input type="radio" id="n10" name="nota">
            <label for="n10">10</label>

        </div>


        <!-- COMENTÁRIO -->

        <textarea placeholder="Deixe seu comentário..."></textarea>


        <!-- ENVIAR -->

        <button>
            Enviar avaliação
        </button>

    </div>


    <!-- =========================
       RODAPÉ
    ========================= -->

    <div class="auxiliar">

        <div class="fundo_rodapé roda">

            <img src="img/LogoMeGusta.png" height="200px" width="200px" class="img-fluid" alt="Logo Me Gusta">


            <!-- REDES SOCIAIS -->

            <div class="down_down">

                <a href="https://pt-br.facebook.com/" target="_blank">
                    <img src="Img/Facebook.png" alt="Facebook">
                </a>

                <a href="https://web.whatsapp.com/" target="_blank">
                    <img src="Img/WhatsApp.png" alt="WhatsApp">
                </a>

                <a href="https://www.instagram.com/" target="_blank">
                    <img src="Img/Instragram rodapé.png" alt="Instagram">
                </a>

            </div>


            <!-- SLOGAN -->

            <div class="slogan_roda">

                <p>
                    Exclusividade<br>
                    e verdadeiro<br>
                    sabor, Isso é<br>
                    Me Gusta!
                </p>

            </div>

        </div>

    </div>


    <!-- =========================
       BOOTSTRAP JAVASCRIPT
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

</body>

</html>
