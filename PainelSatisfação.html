<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Satisfação</title>
  <link rel="stylesheet" href="estilos/style.css">
  <style>
     @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Geostar+Fill&family=Oswald:wght@200..700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS:wght@100..400&family=Playwrite+NZ+Guides&family=Poller+One&family=Supermercado+One&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: rgb(222, 222, 222);
    }

    .menu {
      background-image: url(img/banner\ 9.png);
      width: 100%;
      height: 200px;
    }

    .titulo {
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 50px;
      padding: 15px;
      color: rgb(110, 52, 1);
    }

    .clear {
      clear: both;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
      font-size: 23px;
      font-family: "Oswald", sans-serif;
    }

    .rating {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .rating input {
      /*Cria a caixa interativa onde o usuário insere os dados*/
      display: none;
    }

    .rating label {
      /*Cria a descrição textual do campo (ex: "Nome:" ou "Digite sua senha:")*/
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      transition: 0.5s;
    }

    .rating input:checked+label { /*o input fica marcado (checked); o label logo depois recebe: fundo marrom e texto branco; o "+" significa o próximo elemento imediatamente depois*/
      background: #6b3e26;
      color: #fff;
    }

    .rating label:hover {  /*Quando passar o mouse, fica com essa cor*/
      background: #cca68a;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: 2px solid #ccc;
      padding: 15px;
      resize: none; /* é uma propriedade do CSS que impede o usuário de alterar o tamanho de um elemento na tela*/
      margin-bottom: 20px;
      font-family: "Oswald", sans-serif;
    }

    button {
      background: #6b3e26;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #8a5335;
    }

    .rodapé {
      width: 20%;
      height: 600px;
      background-size: 100%;
      background-repeat: no-repeat;
      box-sizing: border-box;
    }

    .rodapéA {
      background-image: url(img/logo\ 5.png);
    }

    .rodapéB {
      background-image: url(img/15.jpg);
    }

    .br {
      background-color: white;
    }

    .slogan_roda {
      margin-right: 50px;
      width: 200px;
      font-family: "Poller One", sans-serif;
      text-align: center;
      font-size: 22px;
      color: rgba(224, 224, 216);
      line-height: 40px;
      padding-top: 20px;


    }

    .auxiliar {
      position: relative;
      top: 200px;
    }
    
  </style>
</head>

<body>
  <div class="menu">
    <div class="cabe">
      <div class="logo">
        <img src="img/LogoMeGusta.png" width="200px">

      <div>

          <li><a href="Localização.html">LOCALIZAÇÃO</a></li>
          <li><a href="PainelSatisfação.html">PAINEL SATISFAÇÃO</a></li>
          <li><a href="Sig a gente.html">SIGA A GENTE</a></li>
        </ul>
        </ul>
      </div>
    </div>
    <div class="clear"></div>
    <br>
  </div>


    <div class="container">
      <h1 class="titulo">Painel de Satisfação</h1>
      <p class="subtitle">Como foi sua experiência?</p>

      <div class="rating">
        <!--input type radio; Cria um botão de escolha*/-->

        <!--name nota; Faz todos os botões pertencerem ao mesmo grupo, permitindo selecionar apenas UM.*/-->

        <!--id n0; Dá um identificador único ao botão.*/-->

        <!--<label for="n0">0</label>; Cria o número visível. Quando o usuário clica no número, o botão correspondente é marcado..*/-->
        
        <input type="radio" id="n0" name="nota"><label for="n0">0</label>
        <input type="radio" id="n1" name="nota"><label for="n1">1</label>
        <input type="radio" id="n2" name="nota"><label for="n2">2</label>
        <input type="radio" id="n3" name="nota"><label for="n3">3</label>
        <input type="radio" id="n4" name="nota"><label for="n4">4</label>
        <input type="radio" id="n5" name="nota"><label for="n5">5</label>
        <input type="radio" id="n6" name="nota"><label for="n6">6</label>
        <input type="radio" id="n7" name="nota"><label for="n7">7</label>
        <input type="radio" id="n8" name="nota"><label for="n8">8</label>
        <input type="radio" id="n9" name="nota"><label for="n9">9</label>
        <input type="radio" id="n10" name="nota"><label for="n10">10</label>
      </div>

      <textarea placeholder="Deixe seu comentário..."></textarea>

      <button>Enviar avaliação</button>
    </div>

      <div class="fundo_rodapé roda">
        <img src="img/logo 5.png" height="200px" width="200px">

        </div>
        <div class="slogan_roda">
          <p>Exclusividade<br> e verdadeiro<br> sabor, Isso é <br> Me Gusta!</p>
        </div>
      </div>
    

</body>
