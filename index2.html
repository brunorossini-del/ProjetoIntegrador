<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Me Gusta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Geostar+Fill&family=Oswald:wght@200..700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS:wght@100..400&family=Playwrite+NZ+Guides&family=Poller+One&family=Supermercado+One&display=swap');
        /*importamos a fonte do Google*/
        body {
            background-repeat: no-repeat;
            /* Impede a repetição */
            background-size: cover;
            /* Ajusta a imagem para cobrir toda a área */
            opacity: 0, 5;
            /*opacidade da imagem de fundo*/
            background-color: red;
        }

        /* Menu (nav) usando a cor de fonte que o slogan já usava */
        /* Especificidade alta + !important para não deixar nenhum estilo antigo do style.css (pensado para o <ul> "cru" de antes) bagunçar o menu novo do Bootstrap */
        .cabe .navbar-nav .nav-link {
            color: rgba(224, 224, 216) ;
            font-size: clamp(11px, 1.1vw, 15px) ;
            white-space: nowrap;
            padding-left: 0.6rem ;
            padding-right: 0.6rem ;
        }

        .cabe .nav-link:hover,
        .cabe .nav-link.active {
            color: #abacb1;
        }

        .cabe .navbar-toggler {
            border-color: rgba(224, 224, 216, 0.6);
        }

        .slogan {
            /*fonte usada no slogan*/
            font-family: "Poller One", sans-serif;
            color: rgba(224, 224, 216);
            /*cor da fonte do slogan*/
        }

        /* Tamanho do slogan responsivo: menor no celular, maior em telas grandes */
        .slogan p {
            font-size: clamp(22px, 4vw, 40px);
            margin-bottom: 0;
        }

        /* Mantém a proporção do carrossel em qualquer tamanho de tela */
        .carousel-item img {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <header class="cabe"> <!--div para o cabeçalho-->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid flex-wrap flex-lg-nowrap py-2">

                <a class="navbar-brand py-0" href="index.html">
                    <img src="img/LogoMeGusta.png" alt="Logo Me Gusta" class="img-fluid" style="max-width: 200px;" >
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" style="margin-top: -40px; " id="menuPrincipal">
                    <ul class="navbar-nav ms-lg-4 text-center text-lg-start mt-3 mt-lg-0 flex-lg-nowrap">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="SobreNós.html">SOBRE NÓS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Produtos.html">PRODUTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Eventos.html">EVENTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Localização.html">LOCALIZAÇÃO</a></li>
                        <li class="nav-item"><a class="nav-link" href="PainelSatisfação.html">PAINEL SATISFAÇÃO</a></li>
                        <li class="nav-item"><a class="nav-link" href="Sig a gente.html">SIGA A GENTE</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="slogan text-start container-fluid ps-3 ps-lg-5 py-3">
            <!--div para o slogan-->
            <p>Exclusividade<br>e verdadeiro<br>sabor, Isso é<br>Me Gusta!</p>
            <!--slogan-->
        </div>
    </header>

    <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/img_carrossel1.png" class="d-block w-100" alt="Carrossel Me Gusta imagem 1">
            </div>
            <div class="carousel-item">
                <img src="img/img_carrossel.png" class="d-block w-100" alt="Carrossel Me Gusta imagem 2">
            </div>
            <div class="carousel-item">
                <img src="img/img_carrossel2.png" class="d-block w-100" alt="Carrossel Me Gusta imagem 3">
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
